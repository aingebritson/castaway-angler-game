name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate content
        run: npm run validate
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Balance simulator (acceptance evidence)
        run: |
          npm run -s sim -- --location rocky-point --rig starter --casts 10000 --at 2027-01-15T16:00Z
          npm run -s sim -- --location rocky-point --rig angler --casts 10000 --at 2027-01-15T16:00Z
      - name: Build
        run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
